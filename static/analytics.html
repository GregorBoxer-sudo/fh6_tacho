<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070b">
    <title>Forza Analytics</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/analytics.css">
  </head>
  <body class="analyticsBody">
    <header class="analyticsTop">
      <a class="topLink" href="/">Back</a>
      <strong>Analytics</strong>
      <button id="refreshBtn" type="button">Refresh</button>
    </header>

    <main class="analyticsShell">
      <section class="analyticsBand">
        <div>
          <span>Sessions</span>
          <strong id="sessionCount">0</strong>
        </div>
        <div>
          <span>Cars</span>
          <strong id="carCount">0</strong>
        </div>
        <div>
          <span>Top Speed</span>
          <strong id="topSpeed">0 km/h</strong>
        </div>
        <div>
          <span>Max G</span>
          <strong id="topG">0.00g</strong>
        </div>
      </section>

      <section class="analyticsGrid">
        <aside class="analyticsPane">
          <div class="paneHead">
            <h1>Sessions</h1>
          </div>
          <div id="sessionList" class="list"></div>
        </aside>

        <section class="analyticsPane detailPane">
          <div class="paneHead">
            <h1 id="detailTitle">No session selected</h1>
          </div>
          <div id="detailStats" class="statGrid"></div>
          <div id="chartTabs" class="chartTabs" style="display:none">
            <button class="chartTab active" data-chart="shifts">Shift Points</button>
            <button class="chartTab" data-chart="power">Power &amp; Torque</button>
          </div>
          <canvas id="sessionChart" width="900" height="280"></canvas>
          <div id="lapInfo" class="infoStrip"></div>
        </section>

        <aside class="analyticsPane">
          <div class="paneHead">
            <h1>Cars</h1>
          </div>
          <div id="carList" class="list"></div>
        </aside>
      </section>
    </main>

    <script src="/analytics.js"></script>
  </body>
</html>
