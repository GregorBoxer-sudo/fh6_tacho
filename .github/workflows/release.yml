name: Release

# Fires automatically when you push a version tag (e.g. v0.2.0).
# Can also be triggered manually from the GitHub Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Test gate ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test

      - name: Frontend syntax checks
        run: |
          node --check static/app.js
          node --check static/analytics.js
          node --check static/sw.js

      - name: Install cargo-audit
        id: install-audit
        continue-on-error: true
        run: cargo install cargo-audit --locked

      - name: Dependency security audit
        id: audit
        if: ${{ steps.install-audit.outcome == 'success' }}
        continue-on-error: true
        run: cargo audit

      - name: Report dependency audit issue
        if: ${{ steps.install-audit.outcome == 'failure' || steps.audit.outcome == 'failure' }}
        run: |
          echo "::warning::Dependency audit did not pass cleanly. Check the cargo-audit step log before publishing if this release is security-sensitive."

  # ── Linux (Ubuntu 22.04 for broad glibc compatibility) ──────────────────────
  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/forza-tacho forza-tacho-linux-x86_64

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: forza-tacho-linux-x86_64

  # ── Windows (native runner) ──────────────────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-2022
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Decode Windows signing certificate
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "windows-signing-cert.pfx",
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )

      - name: Sign Windows binary
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $signtoolPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtoolPath) {
            $signtoolPath = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1).FullName
          }
          if (-not $signtoolPath) {
            throw "signtool.exe not found"
          }
          & $signtoolPath sign `
            /f windows-signing-cert.pfx `
            /p "$env:WINDOWS_CERT_PASSWORD" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            target/release/forza-tacho.exe

      - name: Remove signing certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path windows-signing-cert.pfx) {
            Remove-Item windows-signing-cert.pfx -Force
          }

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: target/release/forza-tacho.exe

  # ── macOS universal binary (Intel + Apple Silicon) ───────────────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build ARM (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/forza-tacho \
            target/x86_64-apple-darwin/release/forza-tacho \
            -output forza-tacho-macos

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: forza-tacho-macos

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: linux
          path: artifacts

      - uses: actions/download-artifact@v5
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v5
        with:
          name: macos
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum \
            forza-tacho-linux-x86_64 \
            forza-tacho.exe \
            forza-tacho-macos \
            > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/forza-tacho-linux-x86_64
            artifacts/forza-tacho.exe
            artifacts/forza-tacho-macos
            artifacts/SHA256SUMS.txt
