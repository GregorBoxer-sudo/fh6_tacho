name: Release

# Fires automatically when you push a version tag (e.g. v0.2.0).
# Can also be triggered manually from the GitHub Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ── Linux (Ubuntu 22.04 for broad glibc compatibility) ──────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/forza-tacho forza-tacho-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: forza-tacho-linux-x86_64

  # ── Windows (native runner) ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/forza-tacho.exe

  # ── macOS universal binary (Intel + Apple Silicon) ───────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build ARM (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/forza-tacho \
            target/x86_64-apple-darwin/release/forza-tacho \
            -output forza-tacho-macos

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: forza-tacho-macos

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/forza-tacho-linux-x86_64
            artifacts/forza-tacho.exe
            artifacts/forza-tacho-macos
