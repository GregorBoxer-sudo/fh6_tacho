name: Release

# Fires automatically when you push a version tag (e.g. v0.2.0).
# Can also be triggered manually from the GitHub Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ── Linux (native, Ubuntu 22.04 for broad glibc compatibility) ──────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/forza-tacho forza-tacho-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: forza-tacho-linux-x86_64

  # ── Windows (native runner — avoids MinGW cross-compile quirks) ─────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/forza-tacho.exe

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/forza-tacho-linux-x86_64
            artifacts/forza-tacho.exe
